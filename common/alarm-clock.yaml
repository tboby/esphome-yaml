# ==========================================
# OFFLINE ALARM CLOCK PACKAGE
# Reference this from your device config via packages:
#   alarm_clock: github://.../common/alarm-clock.yaml@commit
# Requires: atoms3r-with-echo-base.yaml (provides timer_ringing, mww, display)
# ==========================================

time:
  - platform: homeassistant
    id: current_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - if:
              condition:
                and:
                  - switch.is_on: alarm_enabled
                  - switch.is_off: timer_ringing
                  - lambda: |-
                      auto now = id(current_time).now();
                      if (!now.is_valid() || !id(alarm_time).has_state()) return false;
                      return (now.hour == id(alarm_time).hour) && 
                             (now.minute == id(alarm_time).minute);
              then:
                - switch.turn_on: timer_ringing
                # Don't turn off alarm_enabled - user must manually disable
                # This allows the alarm to fire daily at the same time

datetime:
  - platform: template
    name: "Alarm Time"
    id: alarm_time
    type: time
    optimistic: yes
    restore_value: yes

switch:
  - platform: template
    name: "Alarm Active"
    id: alarm_enabled
    icon: "mdi:alarm-check"
    optimistic: yes
    restore_mode: RESTORE_DEFAULT_OFF

# ==========================================
# ALARM LOOP SCRIPT: Play-Pause-Listen Pattern
# This works around the I2S bus limitation by:
# 1. Playing one loop of alarm sound
# 2. Pausing and listening for "stop" wake word
# 3. Repeating until "stop" is detected or 15min timeout
# ==========================================
script:
  - id: alarm_loop
    mode: single
    then:
      - repeat:
          count: 200  # Max iterations (~15 min worth)
          then:
            # Exit if alarm was dismissed
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - script.stop: alarm_loop
            # Play alarm once
            - media_player.speaker.play_on_device_media_file:
                media_file: timer_finished_sound
                announcement: true
            # Wait for announcement to START
            - wait_until:
                condition:
                  media_player.is_announcing:
                timeout: 3s
            # Wait for announcement to FINISH
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing:
                timeout: 15s
            # Check if still active before listening phase
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  # Start listening for "stop" wake word
                  - script.execute: start_wake_word
                  # Listen for 2 seconds
                  - delay: 2s
                  # Only stop wake word if alarm is still active
                  # (if user dismissed during listen window, on_turn_off already restarted it)
                  - if:
                      condition:
                        switch.is_on: timer_ringing
                      then:
                        - script.execute: stop_wake_word
